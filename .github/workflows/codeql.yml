name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 03:27 UTC (11:27 Asia/Shanghai).
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore NuGet dependencies
        run: dotnet restore GitVisualizer.slnx

      - name: Build solution for analysis
        run: dotnet build GitVisualizer.slnx --configuration Release --no-restore --no-incremental

      - name: Analyze C# code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
