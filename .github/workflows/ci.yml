name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet dependencies
        run: dotnet restore GitVisualizer.slnx

      - name: Build solution
        run: dotnet build GitVisualizer.slnx --configuration Release --no-restore

      - name: Run all tests in the solution
        run: dotnet test GitVisualizer.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
